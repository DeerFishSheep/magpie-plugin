<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系统提示词</title>
<link rel="stylesheet" href="style.css">
<script src="_magpie/bridge.js"></script>
</head>
<body>
<main>
  <header class="head">
    <h1>系统提示词</h1>
    <p>保存多套，点一下切换。注入时接在 agent 自己的提示词旁边，不会丢弃它。</p>
  </header>

  <nav class="rail">
    <div class="chips" id="chips"></div>
    <button class="add" id="new" title="新建一套">＋</button>
  </nav>

  <section class="card">
    <input class="name" id="name" placeholder="未命名" autocomplete="off" spellcheck="false">

    <textarea id="prompt" spellcheck="false" placeholder="在这里粘贴提示词原文，换行和引号都不用转义…"></textarea>

    <div class="bar">
      <span class="count" id="count">0 字 · 0 行</span>
      <span class="dirty" id="dirty"></span>
    </div>
  </section>

  <section class="opts">
    <div class="opt">
      <span class="opt-label">插入位置</span>
      <div class="seg" id="seg">
        <button type="button" data-v="append">追加在后面</button>
        <button type="button" data-v="prepend">放在前面</button>
      </div>
      <p class="opt-hint" id="posHint">保持 agent 提示词缓存有效，通常选这个。</p>
      <input type="hidden" id="position" value="append">
    </div>

    <details class="opt more">
      <summary>筛选生效范围</summary>
      <div class="opt-body">
        <label class="opt">
          <span class="opt-label">仅这些 agent</span>
          <input id="agents" placeholder="全部，或填 claude, codex" autocomplete="off" spellcheck="false">
        </label>
        <label class="opt">
          <span class="opt-label">仅这些模型前缀</span>
          <input id="models" placeholder="全部，或填 deepseek, gpt-5" autocomplete="off" spellcheck="false">
        </label>
      </div>
    </details>
  </section>

  <footer class="foot">
    <button class="primary" id="save">保存并启用</button>
    <button class="ghost" id="del">删除</button>
    <span class="status" id="status"></span>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
